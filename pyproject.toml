[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "r730xd-fan-console"
version = "0.4.1"
description = "Dell R730xd iDRAC fan control console"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2,<7",
]

[tool.setuptools.packages.find]
# Two top-level packages: the desktop app and the code shared with the Web
# line. Without r730xd_core here, `pip install -e .` silently omits it and
# every import of it fails at runtime.
include = ["r730xd_fan*", "r730xd_core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
