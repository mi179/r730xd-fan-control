[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "r730xd-fan-console"
version = "0.4.0"
description = "Dell R730xd iDRAC fan control console"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2,<7",
]

[tool.setuptools.packages.find]
include = ["r730xd_fan*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
