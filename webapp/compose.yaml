services:
  r730xd-fan-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: r730xd-fan-web:0.3.1
    container_name: r730xd-fan-web
    restart: unless-stopped
    init: true
    # OpenWrt's firewall "docker" zone tracks Docker's existing bridge.  The
    # endpoint-level MAC form is required by recent Docker engines; the legacy
    # service-level `mac_address` may be accepted but silently ignored.
    networks:
      r730xd-control:
        ipv4_address: 172.30.73.2
        mac_address: "${WEB_CONTAINER_MAC:-02:73:0d:73:00:01}"
    ports:
      - "${WEB_BIND_ADDRESS:-192.168.5.2}:${WEB_PORT:-8088}:8080"
    environment:
      AUTH_MODE: "idrac"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:?FLASK_SECRET_KEY must be set in .env}"
      WEB_COOKIE_SECURE: "${WEB_COOKIE_SECURE:-false}"
      REQUIRE_ORIGIN: "true"
      TELEMETRY_CACHE_TTL: "${TELEMETRY_CACHE_TTL:-8}"
      TELEMETRY_SAMPLE_INTERVAL: "${TELEMETRY_SAMPLE_INTERVAL:-15}"
      HISTORY_MAX_SAMPLES: "${HISTORY_MAX_SAMPLES:-90}"
      # Durable history. Leave TELEMETRY_DB_PATH empty to go back to
      # memory-only. The volume stays writable even with read_only: true.
      TELEMETRY_DB_PATH: "${TELEMETRY_DB_PATH:-/data/telemetry.db}"
      TELEMETRY_RETENTION_DAYS: "${TELEMETRY_RETENTION_DAYS:-30}"
      TELEMETRY_FLUSH_INTERVAL: "${TELEMETRY_FLUSH_INTERVAL:-60}"
      TELEMETRY_FLUSH_THRESHOLD: "${TELEMETRY_FLUSH_THRESHOLD:-20}"
      IDRAC_HOST: "${IDRAC_HOST:-192.168.5.151}"
      IDRAC_MAC: "${IDRAC_MAC:?IDRAC_MAC must be set for safe discovery}"
      IDRAC_DISCOVERY_CIDR: "${IDRAC_DISCOVERY_CIDR:?IDRAC_DISCOVERY_CIDR must be set}"
      IDRAC_ARP_FILE: "/run/host-proc-net-arp"
      IDRAC_ARP_INTERFACE: "${IDRAC_ARP_INTERFACE:-br-lan}"
      IDRAC_DISCOVERY_SCAN_INTERVAL: "${IDRAC_DISCOVERY_SCAN_INTERVAL:-60}"
      IDRAC_DISCOVERY_PROBE_TIMEOUT: "${IDRAC_DISCOVERY_PROBE_TIMEOUT:-0.8}"
      IDRAC_DISCOVERY_MAX_HOSTS: "256"
      IDRAC_USER: "${IDRAC_USER:-root}"
      IDRAC_PASSWORD_FILE: "/run/secrets/idrac_password"
      IDRAC_IPMI_PORT: "${IDRAC_IPMI_PORT:-623}"
      IDRAC_REDFISH_PORT: "${IDRAC_REDFISH_PORT:-443}"
      REDFISH_VERIFY_TLS: "${REDFISH_VERIFY_TLS:-false}"
      # Pin the iDRAC leaf certificate by SHA-256. Without it, Redfish
      # Basic auth hands the iDRAC password to whatever answers on 443.
      REDFISH_TLS_FINGERPRINT: "${REDFISH_TLS_FINGERPRINT:-}"
      IPMITOOL_PATH: "/usr/sbin/ipmitool"
      TZ: "${TZ:-Asia/Shanghai}"
    secrets:
      - idrac_password
    volumes:
      # /proc/net/arp would be interpreted in the container namespace.  PID 1
      # belongs to the OpenWrt host, so this file is the host LAN ARP table.
      - /proc/1/net/arp:/run/host-proc-net-arp:ro
      - r730xd-telemetry:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  r730xd-telemetry:
    name: r730xd-telemetry

secrets:
  idrac_password:
    file: ./secrets/idrac_password

networks:
  r730xd-control:
    external: true
    name: r730xd-fan-control
